.seat.active .seat-name{box-shadow:0 0 0 2px #d4b053,0 0 8px #fff7,0 0 13px #d3ad4d66}.turn-dot{display:none}

/* bets physically attached to owner, just inward from rail */
.seat-bet{position:absolute;z-index:2;display:flex;flex-direction:column;align-items:center}
.seat-bet img{width:18px;height:auto;filter:drop-shadow(0 2px 2px #0009)}
.seat-bet span{font-size:7px;font-weight:900;background:#07100eeb;border-radius:7px;padding:1px 3px;line-height:8px}
.top-seat .seat-bet{left:50%;top:104px;transform:translateX(-50%)}
.left-seat .seat-bet{left:66px;top:59px}
.right-seat .seat-bet{right:60px;top:59px}
.lower-seat.left-seat .seat-bet,.lower-seat .seat-bet{top:25px}
.lower-seat.left-seat .seat-bet{left:61px}.lower-seat.right-seat .seat-bet{right:56px}

.card{position:relative;background:#fff;border:1px solid #d8d8d8;color:#111;box-shadow:0 2px 5px #0008;overflow:hidden}
.card.red{color:#ca2525}.rank{position:absolute;left:5px;top:4px}.suit{position:absolute;right:5px;bottom:4px}

/* reserved centre lanes */
.pot-box{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);width:94px;padding:5px 7px;border-radius:11px;background:#082c1fe8;border:1px solid #1e4d3b;text-align:center;z-index:120;box-shadow:0 3px 10px #0007}
.pot-box small{display:block;font-size:8px}.pot-box b{display:block;color:#f2c42e;font-size:21px;line-height:22px}
.board{position:absolute;left:50%;top:45%;transform:translateX(-50%);width:230px;display:flex;justify-content:center;gap:4px;z-index:110}
.board .card{width:42px;height:59px;border-radius:5px}.board .rank{font-size:19px}.board .suit{font-size:27px}
.pot-chips{position:absolute;left:50%;top:60%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;width:108px;height:26px;z-index:104}
.pot-chips img{width:20px;height:auto;margin-left:-7px;filter:drop-shadow(0 2px 2px #0007)}.pot-chips img:first-child{margin-left:0}
.pot-chips span{position:absolute;top:20px;background:#07100ee8;border-radius:8px;font-size:7px;font-weight:800;padding:1px 5px}
.table-info{position:absolute;left:50%;top:67%;transform:translateX(-50%);width:180px;text-align:center;font-size:8px;line-height:1.2;text-shadow:0 2px 4px #000;font-weight:700;z-index:100}
.table-info b,.table-info span{display:block}

/* hero has its own reserved bottom-centre area */
.hero{position:absolute;left:50%;bottom:-5px;width:126px;height:146px;transform:translateX(-50%);z-index:210;text-align:center}
.hero-avatar{position:absolute;left:50%;top:0;transform:translateX(-50%);width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#202832;border:3px solid #dedede;font-size:27px;z-index:2}
.hero-cards{position:absolute;left:50%;top:39px;transform:translateX(-50%);display:flex;z-index:4}
.hero-cards .card{width:50px;height:71px;border-radius:6px}.hero-cards .card:first-child{transform:rotate(-4deg) translateX(4px)}.hero-cards .card:last-child{transform:rotate(4deg) translateX(-4px)}
.hero-cards .rank{font-size:22px}.hero-cards .suit{font-size:31px}
.hero-name{position:absolute;left:50%;top:107px;transform:translateX(-50%);width:108px;height:21px;background:#080b0f;border-radius:5px;font-size:9px;font-weight:900;line-height:21px;z-index:6}
.hero-name em{position:absolute;right:7px;color:#c895ff;font-style:normal;font-size:8px}
.hero-stack{position:absolute;left:50%;top:131px;transform:translateX(-50%);color:#61d34f;font-size:10px;font-weight:900}
.hero-hint{position:absolute;left:50%;top:146px;transform:translateX(-50%);color:#e8c75c;font-size:9px;font-weight:900;white-space:nowrap}
.hero-bet{position:absolute;right:-1px;top:67px;display:flex;flex-direction:column;align-items:center}.hero-bet img{width:18px}.hero-bet span{font-size:7px;background:#07100ee8;border-radius:7px;padding:1px 3px}
.hero-cards.premium{animation:premiumGlow 1.8s ease-out both}.hero-cards.premium .card{box-shadow:0 0 0 2px #f5d459,0 0 10px 4px #ffc83cbb,0 0 20px 7px #ff98005c}
@keyframes premiumGlow{0%,100%{filter:drop-shadow(0 0 0 transparent)}35%{filter:drop-shadow(0 0 13px #ffd451)}}

/* action controls have a fixed reserved bottom region */
.sitout{position:absolute;left:12px;bottom:157px;font-size:9px;z-index:300;display:flex;align-items:center;gap:6px}.sitout span{width:20px;height:20px;border-radius:3px;background:#05080b;border:1px solid #89939e}
.controls{position:absolute;left:9px;right:9px;bottom:9px;height:140px;z-index:300}
.presets{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;height:34px}.presets button,.slider,.actions button{background:#111923;border:1px solid #38434e;border-radius:7px}.presets button{font-size:9px}
.slider{height:38px;margin-top:6px;display:grid;grid-template-columns:32px 1fr 32px 46px;align-items:center;padding:0 5px}.slider button{width:27px;height:27px;border-radius:50%;background:#18212b}.track{height:5px;background:#dfe4e8;border-radius:3px;position:relative}.track i{position:absolute;width:34%;height:100%;background:#7540f5;border-radius:3px}.slider b{text-align:center;color:#e9bd2a}
.actions{height:54px;margin-top:6px;display:grid;grid-template-columns:1fr 1fr 1.25fr 1fr;gap:6px}.actions button{font-size:11px;font-weight:900;color:white}.fold{background:#c71932!important}.check{background:#0baa50!important}.raise{background:#d59f00!important}.allin{background:#7030ef!important}

/* intentionally no landscape layout; same portrait stage only scales to fit */
</style>
</head>
<body><div id="app"></div><script>
const DESIGN = { w: 390, h: 844 };
let mode = 9;
let premium = "AA";

const seats9 = [
  {name:"Mia",  x:18, y:76, stack:4950, bet:25, avatar:"👩"},
  {name:"Jack", x:9,  y:54, stack:4900, bet:50, avatar:"🤠"},
  {name:"Luna", x:10, y:32, stack:4900, bet:50, avatar:"🦊"},
  {name:"Max",  x:34, y:10, stack:4900, bet:50, avatar:"🧔"},
  {name:"Nova", x:66, y:10, stack:5000, bet:0,  avatar:"👱‍♀️", active:true},
  {name:"Leo",  x:90, y:32, stack:4900, bet:50, avatar:"🧑‍🦱"},
  {name:"Ivy",  x:91, y:54, stack:4900, bet:50, avatar:"👩‍🦰"},
  {name:"Kai",  x:82, y:76, stack:4900, bet:50, avatar:"🧑"}
];

const seats6 = [
  {name:"Mia",  x:18, y:74, stack:4975, bet:25, avatar:"👩"},
  {name:"Jack", x:9,  y:45, stack:4950, bet:50, avatar:"🤠"},
  {name:"Luna", x:50, y:10, stack:4950, bet:50, avatar:"🦊", active:true},
  {name:"Max",  x:91, y:45, stack:4950, bet:50, avatar:"🧔"},
  {name:"Nova", x:82, y:74, stack:4950, bet:50, avatar:"👱‍♀️"}
];

function rankSuit(v){
  const suit=v.slice(-1);
  return { rank:v.slice(0,-1), suit, red:"♥♦".includes(suit) };
}
function card(v, cls=""){
  const c=rankSuit(v);
  return `<div class="card ${cls} ${c.red?"red":""}">
    <b class="rank">${c.rank}</b><span class="suit">${c.suit}</span>
  </div>`;
}
function betChip(s){
  if(!s.bet) return "";
  const img = s.bet >= 500 ? "chip-black.png" :
              s.bet >= 200 ? "chip-blue.png" :
              s.bet >= 100 ? "chip-red.png" : "chip-green.png";
  return `<div class="seat-bet">
    <img src="./assets/${img}" alt=""><span>${s.bet}</span>
  </div>`;
}
function seatHTML(s){
  const pos = s.y<=15 ? "top-seat" : s.y>=68 ? "lower-seat" : s.x<50 ? "left-seat" : "right-seat";
  return `<div class="seat ${pos} ${s.active?"active":""}" style="--sx:${s.x}%;--sy:${s.y}%">
    <div class="seat-avatar">${s.avatar}</div>
    <div class="seat-cards">${card("8♣")}${card("6♦")}</div>
    <div class="seat-name">${s.name}<i class="turn-dot"></i></div>
    <div class="seat-stack">${s.stack.toLocaleString()}</div>
    ${betChip(s)}
  </div>`;
}

function premiumCards(){
  if(premium==="KK") return ["K♠","K♥"];
  if(premium==="QQ") return ["Q♠","Q♥"];
  if(premium==="AK") return ["A♠","K♥"];
  return ["A♠","A♥"];
}

function render(){
  const seats = mode===9 ? seats9 : seats6;
  const hero = premiumCards();
  document.getElementById("app").innerHTML = `
  <div class="shell">
    <div class="stage">
      <div class="hud top-left"><button class="round">☰</button><button class="count">👥 ${mode} / ${mode}</button></div>
      <div class="hud top-right"><button class="round">🔊</button></div>
      <div class="break">Next Break<br><b>51:30</b></div>

      <div class="qa">
        <button data-mode="6" class="${mode===6?"on":""}">6 MAX</button>
        <button data-mode="9" class="${mode===9?"on":""}">9 MAX</button>
        <span></span>
        ${["AA","KK","QQ","AK"].map(x=>`<button data-premium="${x}" class="${premium===x?"on":""}">${x}</button>`).join("")}
      </div>

      <div class="table-zone">
        ${seats.map(seatHTML).join("")}

        <div class="pot-box"><small>Total Pot</small><b>1,050</b></div>

        <div class="board">
          ${["A♥","K♣","2♦","7♠","J♥"].map(x=>card(x,"board-card")).join("")}
        </div>

        <div class="pot-chips">
          ${["red","blue","green","purple","black"].map(c=>`<img src="./assets/chip-${c}.png" alt="">`).join("")}
          <span>1,050</span>
        </div>

        <div class="table-info">
          <b>Blinds 25 / 50 · Ante 0</b>
          <span>Next 50 / 100 in 02:00</span>
          <span>Next Break 51:30</span>
        </div>

        <div class="hero">
          <div class="hero-avatar">😎</div>
          <div class="hero-cards premium">${card(hero[0],"hero-card")}${card(hero[1],"hero-card")}</div>
          <div class="hero-name">You <em>TB 3</em></div>
          <div class="hero-stack">5,000</div>
          <div class="hero-hint">${premium==="AA"?"Pocket Aces":premium==="KK"?"Pocket Kings":premium==="QQ"?"Pocket Queens":"Ace King"}</div>
          <div class="hero-bet"><img src="./assets/chip-red.png" alt=""><span>100</span></div>
        </div>
      </div>

      <label class="sitout"><span></span> Sit out next hand</label>

      <div class="controls">
        <div class="presets">
          <button>½ Pot</button><button>¾ Pot</button><button>Pot</button><button>2x Pot</button><button>All-in</button>
        </div>
        <div class="slider"><button>−</button><div class="track"><i></i></div><button>+</button><b>150</b></div>
        <div class="actions">
          <button class="fold">FOLD</button><button class="check">CHECK</button><button class="raise">RAISE TO 150</button><button class="allin">ALL-IN</button>
        </div>
      </div>
    </div>
  </div>`;

  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ mode=+b.dataset.mode; render(); });
  document.querySelectorAll("[data-premium]").forEach(b=>b.onclick=()=>{ premium=b.dataset.premium; render(); });
  fitPortraitStage();
}

function fitPortraitStage(){
  const stage=document.querySelector(".stage");
  if(!stage) return;
  const scale=Math.min(innerWidth/DESIGN.w, innerHeight/DESIGN.h);
  stage.style.transform=`translate(-50%,-50%) scale(${scale})`;
}
addEventListener("resize",fitPortraitStage);
addEventListener("orientationchange",fitPortraitStage);
render();
</script></body>
</html>
